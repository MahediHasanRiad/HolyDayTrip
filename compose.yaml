services:
    api:
        build:
            context: .
            target: development
        command: sh -c "npm run prisma:generate && npm run dev"
        env_file: .env
        ports:
            - '${PORT:-3000}:3000'
        volumes:
            - .:/app
            - api_node_modules:/app/node_modules
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        image: postgres:17.7-alpine
        environment:
            POSTGRES_DB: holydaytrip
            POSTGRES_USER: holydaytrip
            POSTGRES_PASSWORD: holydaytrip
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U holydaytrip -d holydaytrip']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8.4-alpine
        ports:
            - '${REDIS_PORT:-6379}:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    api_node_modules:
    postgres_data:
    redis_data:

openapi: 3.1.0
info:
  title: HolyDayTrip API
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      summary: Register with email and password
      responses: { '201': { description: Session established }, '409': { description: Email already registered } }
  /api/v1/auth/login:
    post:
      summary: Sign in with email and password
      responses: { '200': { description: Session established }, '401': { description: Invalid credentials } }
  /api/v1/auth/google:
    post:
      summary: Sign in with a verified Google ID token
      responses: { '200': { description: Session established }, '401': { description: Invalid Google identity } }
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh credential
      responses: { '200': { description: Session refreshed }, '401': { description: Invalid session } }
  /api/v1/auth/sign-out:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Session revoked }, '401': { description: Unauthenticated } }
  /api/v1/auth/me:
    get:
      summary: Get the authenticated user's safe profile
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Safe authenticated user }, '401': { description: Unauthenticated } }
  /api/v1/auth/verification/request:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Verification OTP requested }, '429': { description: Rate limited } }
  /api/v1/auth/verification/confirm:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Email verified }, '422': { description: Invalid OTP } }
  /api/v1/auth/password-reset/request:
    post:
      responses: { '200': { description: Generic reset response }, '429': { description: Rate limited } }
  /api/v1/auth/password-reset/complete:
    post:
      responses: { '200': { description: Password changed }, '422': { description: Invalid OTP } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: holydaytrip_refresh }
